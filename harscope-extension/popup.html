<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0a0e13;
      --ink: #eafaff;
      --muted: #7e94a2;
      --key-top: #202e38;
      --key-bot: #0b1016;
      --key-border: #2a3a46;
      --accent: #2bd6e6;
      --accent-bright: #5ff0ff;
      --accent-deep: #0f8aa0;
      --ink-dark: #04252c;
      --danger: #e2574e;
    }
    * { box-sizing: border-box; }
    body {
      width: 300px; margin: 0; padding: 14px;
      font: 13px system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(130% 90% at 50% 0%, #121a22 0%, var(--bg) 60%);
    }
    .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    .brand svg { filter: drop-shadow(0 0 6px rgba(43,214,230,.5)); }
    .brand h1 {
      font: 600 15px ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
      margin: 0; letter-spacing: .5px; color: var(--ink);
    }
    .brand h1 span { color: var(--accent); }
    label { display: block; font: 11px ui-monospace, Consolas, monospace; color: var(--muted); margin: 9px 0 3px; }
    input {
      width: 100%; padding: 7px 9px; color: var(--ink);
      background: #0c131a; border: 1px solid var(--key-border); border-radius: 8px;
      font: 12px ui-monospace, Consolas, monospace; outline: none;
    }
    input:focus { border-color: var(--accent-deep); box-shadow: 0 0 0 2px rgba(43,214,230,.15); }
    .row { display: flex; gap: 8px; margin-top: 11px; }

    /* buttons as keys */
    button {
      flex: 1; padding: 8px 10px; border: 1px solid var(--key-border); border-radius: 10px;
      font: 600 12px ui-monospace, Consolas, monospace; color: var(--ink); cursor: pointer;
      background: linear-gradient(180deg, var(--key-top), var(--key-bot));
      transition: filter .12s, box-shadow .12s;
    }
    button:hover { filter: brightness(1.2); }
    button:disabled { opacity: .45; cursor: default; filter: none; }
    /* lit key = primary action */
    button.primary {
      color: var(--ink-dark); border-color: var(--accent-bright);
      background: radial-gradient(120% 120% at 50% 15%, var(--accent-bright), var(--accent) 45%, var(--accent-deep));
      box-shadow: 0 0 14px rgba(43,214,230,.45), inset 0 1px 0 rgba(255,255,255,.35);
    }
    button.primary:hover { box-shadow: 0 0 20px rgba(43,214,230,.65), inset 0 1px 0 rgba(255,255,255,.4); filter: none; }
    button.danger { color: #ffe9e7; border-color: #7a2b28;
      background: linear-gradient(180deg, #3a1d1b, #170c0b); }
    button.danger:not(:disabled):hover { box-shadow: 0 0 12px rgba(226,87,78,.4); filter: none; }

    details { margin-top: 10px; padding: 2px 0; }
    summary { font: 11px ui-monospace, Consolas, monospace; color: var(--muted); cursor: pointer; }
    summary:hover { color: var(--accent); }

    #status { margin-top: 12px; font: 11px ui-monospace, Consolas, monospace; color: var(--muted);
      min-height: 16px; display: flex; align-items: center; gap: 7px;
      padding-top: 10px; border-top: 1px solid #16212b; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #3a4a56; flex: none; }
    .dot.on  { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .dot.rec { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: pulse 1.1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  </style>
</head>
<body>
  <div class="brand">
    <!-- mini "lit key" mark, matching the project icon -->
    <svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="3" y="3" width="42" height="42" rx="12" fill="#05121a" stroke="#123" stroke-width="1"/>
      <rect x="9" y="9" width="30" height="30" rx="9" fill="#0f8aa0"/>
      <rect x="9" y="9" width="30" height="30" rx="9" fill="none" stroke="#5ff0ff" stroke-width="1.5"/>
      <g stroke="#04252c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polyline points="19,18 27,24 19,30"/>
        <line x1="29" y1="31" x2="35" y2="31"/>
      </g>
    </svg>
    <h1>harscope<span>&nbsp;capture</span></h1>
  </div>

  <details id="cfg">
    <summary>› bridge connection</summary>
    <label>Bridge URL (from the AI's bridge_status)</label>
    <input id="url" placeholder="http://127.0.0.1:7331">
    <label>Token</label>
    <input id="token" placeholder="paste token">
    <div class="row">
      <button id="save">Save</button>
      <button id="test">Test</button>
    </div>
  </details>

  <div class="row">
    <button id="start" class="primary">Start capture</button>
    <button id="stop" class="danger" disabled>Stop</button>
  </div>
  <div class="row">
    <button id="send" class="primary">Send capture to AI</button>
  </div>

  <div id="status"><span class="dot" id="dot"></span><span id="msg">Loading…</span></div>

  <script src="popup.js"></script>
</body>
</html>
