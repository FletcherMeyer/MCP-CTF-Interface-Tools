<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0e0716; --ink: #f3e9ff; --muted: #8b7aa0;
      --key: #1e1330; --key-border: #3a2a52;
      --accent: #a855f7; --accent-bright: #c77dff; --accent-deep: #7c3aed;
      --ink-dark: #190a2e; --danger: #e2574e; --err: #ff5a52;
    }
    * { box-sizing: border-box; }
    body { width: 300px; margin: 0; padding: 14px; color: var(--ink); background: var(--bg);
      font: 13px system-ui, -apple-system, sans-serif; }
    .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    .brand svg { filter: drop-shadow(0 0 6px rgba(168,85,247,.5)); }
    .brand h1 { margin: 0; font: 600 15px ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .5px; }
    .brand h1 span { color: var(--accent); }
    label { display: block; font: 11px ui-monospace, Consolas, monospace; color: var(--muted); margin: 9px 0 3px; }
    input { width: 100%; padding: 7px 9px; color: var(--ink); background: #140b22;
      border: 1px solid var(--key-border); border-radius: 8px; font: 12px ui-monospace, Consolas, monospace; outline: none; }
    input:focus { border-color: var(--accent-deep); box-shadow: 0 0 0 2px rgba(168,85,247,.18); }
    .row { display: flex; gap: 8px; margin-top: 11px; }
    button { flex: 1; padding: 8px 10px; border: 1px solid var(--key-border); border-radius: 10px;
      font: 600 12px ui-monospace, Consolas, monospace; color: var(--ink); cursor: pointer; background: var(--key);
      transition: filter .12s, box-shadow .12s; }
    button:hover { filter: brightness(1.3); }
    button:disabled { opacity: .45; cursor: default; filter: none; }
    button.primary { color: #f6ecff; border-color: var(--accent-bright); background: var(--accent);
      box-shadow: 0 0 14px rgba(168,85,247,.4); }
    button.primary:hover { box-shadow: 0 0 20px rgba(168,85,247,.6); filter: none; }
    button.danger { color: #ffd9d6; border-color: #7a2b28; background: #2a1614; }
    button.danger:not(:disabled):hover { box-shadow: 0 0 12px rgba(226,87,78,.4); filter: none; }
    details { margin-top: 10px; } summary { font: 11px ui-monospace, Consolas, monospace; color: var(--muted); cursor: pointer; }
    summary:hover { color: var(--accent); }
    .hint { margin-top: 10px; font: 11px ui-monospace, Consolas, monospace; color: var(--muted); line-height: 1.5; }
    #status { margin-top: 12px; font: 11px ui-monospace, Consolas, monospace; color: var(--muted);
      display: none; align-items: center; gap: 7px; padding-top: 10px; border-top: 1px solid #1e1330; }
    #status.error #msg { color: #ff8a83; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #3a2a52; flex: none; }
    .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .dot.rec { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: pulse 1.1s infinite; }
    .dot.err { background: var(--err); box-shadow: 0 0 9px var(--err); }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  </style>
</head>
<body>
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="3" y="3" width="42" height="42" rx="12" fill="#1a0b2e" stroke="#3a2a52" stroke-width="1"/>
      <g stroke="#c77dff" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M14 18 V14 H18"/><path d="M34 18 V14 H30"/>
        <path d="M14 30 V34 H18"/><path d="M34 30 V34 H30"/>
      </g>
      <circle cx="24" cy="24" r="3.5" fill="#a855f7"/>
    </svg>
    <h1>screen<span>scope</span></h1>
  </div>

  <details id="cfg">
    <summary>› bridge connection</summary>
    <label>Bridge URL (from the AI's bridge_status)</label>
    <input id="url" placeholder="http://127.0.0.1:7333">
    <label>Token</label>
    <input id="token" placeholder="paste token">
    <div class="row">
      <button id="save">Save</button>
      <button id="test">Test</button>
    </div>
  </details>

  <div class="hint">Drag the purple frame over the console, resize it, then Start. The framed region streams to the AI ~1×/sec.</div>

  <div class="row">
    <button id="start" class="primary">Start reading</button>
    <button id="stop" class="danger" disabled>Stop</button>
  </div>

  <div id="status"><span class="dot" id="dot"></span><span id="msg"></span></div>

  <script src="popup.js"></script>
</body>
</html>
